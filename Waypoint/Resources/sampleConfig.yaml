#---------------------------------------------------#
## Config files live in $HOME/.config/waypoint/*.yaml.
##
## This file is the built-in sample config. Create your own config
## file rather than editing it directly.
## Ports are managed from the menu bar icon -> Config -> More Settings.
#---------------------------------------------------#

mode: rule
log-level: info
mixed-port: 7890

proxies:

proxy-groups:

rules:
  - DOMAIN-SUFFIX,google.com,DIRECT
  - DOMAIN-KEYWORD,google,DIRECT
  - DOMAIN,google.com,DIRECT
  - DOMAIN-SUFFIX,ad.com,REJECT
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
