name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build app (unsigned)
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: |
          xcodebuild \
            -project Waypoint.xcodeproj \
            -scheme Waypoint \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      - name: Test WaypointCore
        run: |
          cd WaypointCore
          swift test

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint --reporter github-actions-logging

      - name: SwiftFormat (advisory)
        continue-on-error: true
        run: swiftformat --lint .
