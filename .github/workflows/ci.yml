name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # mihomo, the dashboard and Country.mmdb.gz are produced by
      # install_dependency.sh and are not tracked, but the app target copies all
      # three into the bundle. Stub them so this job stays a compile/link check
      # that does not depend on the download; the supply-chain job verifies the
      # real core separately.
      - name: Stub generated resources
        run: |
          printf 'int main(void) { return 0; }\n' > /tmp/mihomo.c
          clang -o Waypoint/Resources/mihomo /tmp/mihomo.c
          mkdir -p Waypoint/Resources/dashboard
          printf '<!doctype html>\n' > Waypoint/Resources/dashboard/index.html
          printf '' | gzip -c > Waypoint/Resources/Country.mmdb.gz

      - name: Build app (unsigned)
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: |
          set -o pipefail
          xcodebuild \
            -project Waypoint.xcodeproj \
            -scheme Waypoint \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      # xcodebuild rewrites its pin file whenever it resolves something that
      # disagrees with it, so any change here means the committed pins no longer
      # describe what the app builds against. This file must list exactly the
      # packages the project declares: a pin for a package with no
      # packageReferences entry makes Xcode 26 abort before compiling, with an
      # internal count mismatch in IDESwiftPackageCore (SIGABRT, exit 134), not
      # a normal build error. Xcode 26 does not revalidate originHash for this
      # embedded-project store, so a stale hash alone is inert -- this check is
      # the safety net if a future toolchain starts validating it.
      #
      # git status, not git diff, so a deleted or untracked pin file is caught
      # too; git diff exits 0 for a path that is no longer tracked.
      - name: Xcode dependency pins are reproducible
        run: |
          PINS=Waypoint.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -n "$(git status --porcelain -- "$PINS")" ]; then
            echo "::error::$PINS was rewritten during this build; the canonical file follows."
            echo "----- BEGIN CANONICAL $PINS -----"
            cat "$PINS"
            echo "----- END CANONICAL $PINS -----"
            exit 1
          fi

      - name: Test WaypointCore
        run: |
          cd WaypointCore
          swift test

      - name: Test WaypointNetworking
        run: |
          cd WaypointNetworking
          swift test

      # The package manifests declare version ranges, so the concrete graph only
      # stays fixed if the resolution is committed. SwiftPM rewrites
      # Package.resolved whenever it resolves something that disagrees with it,
      # so any change here means CI is building a different graph than the
      # repository pins. WaypointNetworking declares no dependencies and so has
      # no resolved file.
      #
      # git status, not git diff, so a deleted or untracked pin file is caught
      # too; git diff exits 0 for a path that is no longer tracked.
      - name: Dependency pins are reproducible
        run: |
          PINS=WaypointCore/Package.resolved
          if [ -n "$(git status --porcelain -- "$PINS")" ]; then
            echo "::error::$PINS was rewritten during this build; the canonical file follows."
            echo "----- BEGIN CANONICAL $PINS -----"
            cat "$PINS"
            echo "----- END CANONICAL $PINS -----"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install lint tools
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint --reporter github-actions-logging

      - name: SwiftFormat (advisory)
        continue-on-error: true
        run: swiftformat --lint .

  mihomo-supply-chain:
    name: Mihomo supply chain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Verify pinned download
        run: |
          cd Waypoint/goWaypoint
          python3 bundle_mihomo.py --official

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build mihomo from the pinned source tag
        run: |
          cd Waypoint/goWaypoint
          python3 bundle_mihomo.py --force

      # Upstream injects a wall-clock BUILDTIME, so bit-for-bit equality is
      # not expected; a match is a strong signal, a mismatch alone is not an
      # alarm. The point of this step is to make that status visible and to
      # prove the pinned source builds cleanly.
      - name: Compare source build with official arm64 asset
        continue-on-error: true
        run: |
          VER=$(grep '^version=' Waypoint/goWaypoint/mihomo.sha256 | cut -d= -f2)
          curl -sL -H "User-Agent: Waypoint-build" -o /tmp/official.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$VER/mihomo-darwin-arm64-v$VER.gz"
          gzip -dc /tmp/official.gz | shasum -a 256 > /tmp/official.sha
          shasum -a 256 "Waypoint/goWaypoint/.mihomo-build/v$VER/darwin-arm64" > /tmp/built.sha
          echo "official: $(cat /tmp/official.sha)"
          echo "built:    $(cat /tmp/built.sha)"
          if [ "$(cut -d' ' -f1 /tmp/official.sha)" = "$(cut -d' ' -f1 /tmp/built.sha)" ]; then
            echo "REPRODUCED: official arm64 binary matches the source build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NOT REPRODUCED: official arm64 binary differs from the source build (expected: upstream embeds a build timestamp; audit the tag before trusting the official binary)" >> "$GITHUB_STEP_SUMMARY"
          fi
